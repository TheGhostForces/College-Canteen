events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Весь колледж может сидеть за одним NAT-адресом, поэтому лимиты по IP не должны быть жёсткими.
    # Реальная защита кода подтверждения - счётчик попыток в приложении.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=global:10m rate=100r/s;
    limit_req_status 429;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name voscollege.ru www.voscollege.ru;

        # продление сертификата certbot (webroot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://voscollege.ru$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name voscollege.ru www.voscollege.ru;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        limit_req zone=global burst=200 nodelay;

        include /etc/nginx/security_headers.conf;

        root /usr/share/nginx/html;
        index index.html;

        # Файлы без хеша в имени: кэшируем с обязательной ревалидацией (ETag),
        # иначе правки JS/CSS не доходили бы до пользователей неделю ("immutable" + 7d).
        location ~* \.(css|js|mjs)$ {
            include /etc/nginx/security_headers.conf;
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location /img/ {
            alias /usr/share/nginx/img/;
            include /etc/nginx/security_headers.conf;
            add_header Cache-Control "public, max-age=604800";

            location ~ \.(php|phtml|htaccess|sh)$ {
                deny all;
            }
        }

        # Swagger/OpenAPI наружу не отдаём (приложение с ENABLE_DOCS=false их и так не поднимает)
        location ~ ^/(api/)?(docs|redoc|openapi\.json)(/|$) {
            return 404;
        }

        location /api/auth/ {
            limit_req zone=auth burst=20 nodelay;
            include /etc/nginx/security_headers.conf;
            proxy_hide_header X-Powered-By;
            proxy_pass http://app:8000/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Раньше тут были valid_referers (подделывается одной строкой curl, защиты не даёт)
        # и "proxy_intercept_errors + error_page 404 500 502 503 504 =200 /404.html":
        # все ошибки API превращались в HTTP 200 со страницей index.html, фронтенд не видел ни 404, ни 500.
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            include /etc/nginx/security_headers.conf;

            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;

            proxy_pass http://app:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location / {
            include /etc/nginx/security_headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri $uri/ /index.html;
        }
    }
}
