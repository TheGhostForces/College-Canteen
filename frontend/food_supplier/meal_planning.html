<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Сводка заказов</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/normal.css">
</head>
<body id="meal_planning">
    <input type="checkbox" id="menuToggle" class="checkbox">
    <div id="div_logo"><img src="../png/logo_with_text.png" alt=""></div>
    <header>
        <a href="./meal_planning.html"><img id="dishes_date_img" src="../png/dishes_date.png" alt="Сводка"></a>
        <a href="./order_packaging.html"><img src="../png/order_packaging.png" alt="Упаковка"></a>
        <label for="menuToggle"><img id="settings" src="../png/settings.png" alt="Настройки"></label>
    </header>
    <h1>Сводка заказов</h1>
    <p class="description_form">Выберите организацию и дату выдачи для просмотра заказанных комплектов и буфетной продукции.</p>
    <div class="mini_card"><p>Дата выдачи</p><input type="date" id="date_dishes"></div>
    <div class="mini_card"><p>Образовательная организация</p><select id="selection"><option value="" disabled selected>Название</option></select></div>
    <div class="wrapper_for_btn"><button class="basic_button" type="button" id="find_dishes">Найти</button></div>
    <div id="container_with_data_from_api" aria-live="polite"></div>
<script type="module">
    import { show_message, authRequiredAsync, escapeData, creating_application_elements } from '../js/common.js'

    const selection = document.getElementById('selection')
    const dateInput = document.getElementById('date_dishes')
    const container = document.getElementById('container_with_data_from_api')
    const mealNames = { breakfast: 'Завтрак', lunch: 'Обед', afternoon_snack: 'Полдник', dinner: 'Ужин' }

    document.addEventListener('DOMContentLoaded', authRequiredAsync('provider')(async () => {
        try {
            const response = await fetch('/api/institution/institutions')
            if (!response.ok) throw new Error('Не удалось загрузить организации')
            for (const institution of (await response.json()).Institutions) {
                selection.add(new Option(institution.name, institution.id))
            }
        } catch (error) { show_message(error.message, false) }
        creating_application_elements()
    }))

    let requestVersion = 0
    const invalidateReport = () => { requestVersion++; container.innerHTML = '' }
    selection.addEventListener('change', invalidateReport)
    dateInput.addEventListener('change', invalidateReport)
    document.getElementById('find_dishes').addEventListener('click', async () => {
        const version = ++requestVersion
        const institution = selection.value
        const date = dateInput.value
        const isCurrent = () => version === requestVersion && selection.value === institution && dateInput.value === date
        try {
            if (!institution || !date) throw new Error('Выберите организацию и дату')
            const params = new URLSearchParams({ institution_id: institution, target_date: date })
            const response = await fetch(`/api/orders/supplier-report?${params}`)
            if (!response.ok) throw new Error(`Ошибка загрузки сводки: ${response.status}`)
            const report = await response.json()
            if (!isCurrent()) return
            const sets = report.sets.map(item => {
                const names = item.components.map(component => component.dish_name).filter(Boolean).join(', ')
                const label = `${mealNames[item.meal_type] || item.meal_type} №${item.meal_set_id}${names ? `: ${names}` : ''}`
                return `<div class="mini_card"><p>${escapeData(label)}</p><p>${item.quantity}</p></div>`
            }).join('')
            const buffet = report.buffet.map(item => `<div class="mini_card"><p>${escapeData(item.dish_name)}</p><p>${item.quantity}</p></div>`).join('')
            container.innerHTML = `<h2>Комплекты</h2>${sets || '<p>Нет заказов</p>'}<h2>Буфет</h2>${buffet || '<p>Нет заказов</p>'}`
        } catch (error) { if (isCurrent()) { container.innerHTML = ''; show_message(error.message, false) } }
    })
</script>
</body>
</html>
