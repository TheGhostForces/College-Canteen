        <p>Для использования приложения скачайте мобильное приложение для вашего устройства.</p>
        <div style="display: flex; flex-direction: column; align-items: center; width: 100%; gap: 12px;">

<script type="module" defer>
    import { set_font_size, create_message } from './js/export.js'
    set_font_size()
    create_message()
    const isAndroid = /android/i.test(navigator.userAgent);
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isDesktop = !isAndroid && !isIOS;
    const downloadBtn = document.getElementById('downloadBtn');
    const webBtn = document.getElementById('webBtn');
    if (isAndroid) {
        downloadBtn.textContent = 'Скачать APK';
        downloadBtn.style.display = 'block';
        webBtn.style.display = 'none';
        downloadBtn.onclick = () => { window.location.href = '/voscollege.apk'; };
    } else if (isIOS) {
        downloadBtn.style.display = 'none';
        webBtn.textContent = 'Продолжить в веб-версии';
        webBtn.style.display = 'block';
        webBtn.onclick = () => { window.location.href = '/login.html'; };
    } else {
        downloadBtn.textContent = 'Скачать APK для Android';
        downloadBtn.style.display = 'block';
        webBtn.textContent = 'Продолжить в веб-версии';
        webBtn.style.display = 'block';
        downloadBtn.onclick = () => { window.location.href = '/voscollege.apk'; };
        webBtn.onclick = () => { window.location.href = '/login.html'; };
    }
    const isInApp = /voscollege/i.test(navigator.userAgent) || window.location.href.includes('app=');
    if (isInApp) { window.location.href = '/login.html'; }
</script>
