<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аутентификация</title>
    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="stylesheet" href="./styles/normal.css">
</head>
<body id="enter_page_2">
    <img id="logo" src="./png/logo_with_full_text.png" alt="Воскресенский колледж">

    <h1>Аутентификация</h1>

    <div class="slanted_line"></div>

    <form>
        <p>Для входа в личный кабинет введите код, отправленный Вам на почту.</p>
        <input 
            id="input_id"
            name="sms_code"
            placeholder="Формат: 123456"
            type="tel"
            pattern="\d{6}"
            maxlength="6"
            required>
        <button id="submitButton" class="basic_button" type="submit">Войти</button>
        <a href="./index.html">Вернуться назад</a>
    </form>
<script type="module">
    import {
        show_message,
        setStored,
        getStored,
        rights_verification,
        parseJwtModern,
        create_message,
        set_font_size
    } from './js/common.js'

    set_font_size()
    create_message()

    let DOM = null;

    document.addEventListener('DOMContentLoaded', () => {
        DOM = {
            form: document.querySelector('form'),
            input: document.getElementById('input_id'),
            submitButton: document.getElementById('submitButton'),
            errorMessage: document.querySelector('.error_message_text')
        };
        
        if (DOM.form) {
            DOM.form.addEventListener('submit', handleSubmit);
        }
    })

    async function handleSubmit(e) {
        e.preventDefault();

        show_message('Отправка данных ...')
        DOM.submitButton.disabled = true
        
        try {
            const sms = DOM.input.value;
            
            if (!sms || !/^\d{6}$/.test(sms)) {
                throw new Error('Код должен состоять из 6 цифр');
            }

            const user_authentication = getStored('user_authentication')
            
            if (!user_authentication) {
                window.location.href = './login.html'
                return
            }

            const response = await fetch(
                `/api/auth/confirm?` +
                `user_id=${encodeURIComponent(user_authentication.user_id)}&` +
                `temporary_code_id=${encodeURIComponent(user_authentication.tmp_code_id)}&` +
                `code=${encodeURIComponent(sms)}`, 
                {
                    method: 'POST',
                    credentials: 'include'
                }
            );

            const data = await response.json().catch(() => ({}));
            const detail = String(data.detail || '');

            if (!response.ok) {
                if (detail.includes('Code expired') || detail.includes('Code already used')) {
                    throw new Error('Код истек или уже использован. Запросите новый код.');
                } else if (detail.includes('Incorrect code')) {
                    throw new Error('Неверный код');
                } else if (response.status === 429) {
                    throw new Error('Слишком много попыток. Попробуйте позже.');
                } else {
                    throw new Error(`Ошибка сервера: ${response.status}`);
                }
            }

            // JWT живёт только в HttpOnly-cookie; в localStorage храним лишь роль для маршрутизации
            const role = data.role || (parseJwtModern(data.access_token) || {}).role
            setStored('user_role', role, 30)
            rights_verification(role)
            
        } catch (error) {
            console.error(error);
            show_message(error.message || 'Ошибка входа', '-')
        }

        DOM.submitButton.disabled = false
    }
</script>
</body>
</html>
